name: ISCDT C++ core

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler, CMake and Eigen3
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libeigen3-dev

      - name: Configure and build the CBF core
        run: |
          cmake -S safety-filter -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF
          cmake --build build --parallel

      - name: Build and run the unit tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Isafety-filter/core -I/usr/include/eigen3 \
            tests/test_cbf_core_cpp.cpp build/libcbf_core.a -o test_cbf_core
          ./test_cbf_core

  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest numpy

      - name: Run Zeno guard tests
        run: python -m pytest -q tests/test_zeno_guard.py
